<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventario PDA</title>
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E📦%3C/text%3E%3C/svg%3E">
<style>
:root{color-scheme:light;--bg:#f5f7f8;--card:#ffffff;--primary:#087f68;--primary-light:#e5f5f0;--text:#172b27;--muted:#71817d;--border:#e5ebe9;--danger:#dc5252;--danger-light:#fff0ef;--warning:#d99126;--warning-light:#fff5df;--shadow:0 4px 16px rgba(20,50,42,0.05);box-sizing:border-box}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
header{background:var(--card);color:var(--text);padding:20px 18px;font-size:20px;font-weight:800;border-bottom:1px solid var(--border);letter-spacing:-0.5px}
nav{display:flex;position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--border);padding:5px;gap:4px}
nav button{flex:1;padding:13px 3px;border:none;border-radius:10px;background:transparent;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer}
nav button.on{background:var(--primary-light);color:var(--primary);border:none}
section{display:none;padding:16px;max-width:760px;margin:auto}
section.on{display:block}
.card{background:var(--card);padding:17px;margin:12px 0;border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow)}
.card b{font-size:15px;line-height:1.5}
input{width:100%;padding:15px;margin:7px 0;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);font-size:15px;outline:none}
input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(8,127,104,.10)}
button.btn{width:100%;min-height:46px;padding:12px 14px;margin:5px 0;border:none;border-radius:12px;background:var(--primary);color:white;font-size:14px;font-weight:700;cursor:pointer}
button.btn.sec{background:var(--primary-light);color:var(--primary);border:1px solid transparent}
button.btn.red{background:var(--danger-light);color:var(--danger)}
.row{display:flex;align-items:center;gap:8px}
.small{color:var(--muted);font-size:12px;line-height:1.6}
.qty{font-size:25px;font-weight:800;color:var(--primary);text-align:center}
.pill{display:inline-block;padding:5px 10px;border-radius:20px;background:var(--primary-light);color:var(--primary);font-size:11px;font-weight:700}
.warn{background:var(--danger-light);color:var(--danger)}
#msg{position:fixed;bottom:20px;left:14px;right:14px;z-index:30;padding:15px;border-radius:12px;background:#18332d;color:white;font-size:14px;box-shadow:var(--shadow)}
.dbox{background:white;color:var(--text);border-radius:18px;padding:22px;width:100%;max-width:380px;box-shadow:0 15px 40px #0002}
#dlg{backdrop-filter:blur(4px)}
@media (max-width:480px){header{padding:17px 14px;font-size:18px}section{padding:13px}nav button{font-size:11px;padding:12px 2px}.card{padding:15px}}
#s1{padding-top:22px}
#code{min-height:55px;padding:17px;border:2px solid var(--border);border-radius:15px;background:white;font-size:16px;font-weight:500}
#code:focus{border-color:var(--primary)}
#res .card{margin-top:16px;padding:18px;border-radius:17px}
#res .card b{font-size:16px}
#res .qty{font-size:30px;margin:15px 0}
#res .lote{border-top:1px solid var(--border);padding-top:14px;margin-top:14px}
#res .lote input{min-height:45px}
#res .qn{text-align:center;font-size:21px;font-weight:800;color:var(--primary);min-width:65px}
#res .lote .row{gap:6px}
#res .lote .btn{min-width:0;padding:10px 5px;min-height:45px}
#s1>.row{margin-top:10px}
#s1>.row .btn{min-height:50px}
#s2{padding-top:20px}
#filtro{min-height:52px;margin-bottom:16px;border-radius:14px}
#inv .card{padding:17px;border-radius:15px;margin-bottom:11px;cursor:pointer}
#inv .card:active{transform:scale(.99)}
#inv .card b{font-size:14px;font-weight:750}
#inv .qty{font-size:27px;min-width:65px}
#inv .card .row{margin-top:8px}
#inv .card .small{margin-top:3px}
#inv>.small:last-child{display:block;margin:18px 0;padding:16px;border-radius:12px;background:var(--primary-light);color:var(--primary);font-weight:800;font-size:14px}
#s2>.row{margin-top:15px;gap:8px}
#s2>.row .btn{font-size:12px;min-height:48px}
#s2>.card{margin-top:20px;padding:18px;background:#ffffff}
#s2>.card b{display:block;margin-bottom:6px;font-size:16px}
#s2>.card input[type="file"]{font-size:12px}
#s4{padding-top:20px}
#s4 .chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
#s4 .chip{min-height:44px;padding:10px 5px;border:1px solid var(--border);border-radius:12px;background:white;color:var(--muted);font-size:12px;font-weight:700}
#s4 .chip.on{background:var(--primary);color:white;border-color:var(--primary)}
#pv .card{padding:16px;margin-bottom:12px;border-radius:15px;cursor:pointer}
#pv .card b{font-size:14px;line-height:1.5}
#pv .qty{font-size:26px;min-width:55px}
#pv .pill.warn{display:inline-block;margin-top:8px;padding:6px 10px;background:var(--danger-light);color:var(--danger);border-radius:20px;font-size:11px}
#pv>.small:last-child{display:block;margin-top:18px;padding:13px;text-align:center;color:var(--muted);font-size:12px}
/* Reglas que la app necesita y que el diseño nuevo no traía */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.row>*{flex:1}
#msg{display:none;bottom:calc(20px + env(safe-area-inset-bottom,0px))}
#dlg{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;z-index:40;padding:16px;backdrop-filter:blur(4px)}
.dbox p{margin:0 0 14px;line-height:1.5}
</style>
</head>
<body>
<header>📦 Inventario Farmacia · PDA</header>
<nav>
<button id="t1" class="on" onclick="tab(1)">Escanear</button>
<button id="t2" onclick="tab(2)">Inventario</button>
<button id="t4" onclick="tab(4)">Por vencer</button>
<button id="t3" onclick="tab(3)">Catálogo</button>
</nav>

<section id="s1" class="on">
<input id="code" placeholder="Código de barras, SKU o nombre" autocomplete="off" oninput="vivo()" autofocus>
<div class="row"><button class="btn" onclick="buscarCodigo()">Buscar</button><button class="btn sec" onclick="deshacer()">↩ Deshacer</button></div>
<div id="res"></div>
</section>

<section id="s2">
<input id="filtro" placeholder="Buscar por nombre, SKU o código" oninput="verInv()">
<div id="inv"></div>
<div class="row">
<button class="btn sec" onclick="exportar()">Exportar CSV</button>
<button class="btn red" onclick="borrarInv()">Vaciar conteo</button>
</div>
<button class="btn sec" onclick="deshacer()">↩ Deshacer último cambio</button>
<div class="card"><b>Respaldo</b><div class="small">Guarda tu conteo en un archivo para no perderlo, o restáuralo desde uno anterior.</div>
<button class="btn sec" onclick="respaldar()">Guardar respaldo</button>
<div class="small">Restaurar desde un respaldo (.json)</div>
<input type="file" accept=".json" onchange="restaurar(this)"></div>
</section>

<section id="s3">
<div class="card">
<b>Agregar producto al catálogo</b>
<input id="nSku" placeholder="SKU (ej: 22931)" inputmode="numeric">
<input id="nNom" placeholder="Nombre del producto">
<button class="btn" onclick="addProd()">Guardar producto</button>
</div>
<div class="card">
<b>Importar lista (CSV)</b>
<div class="small">Formato por línea: SKU,Nombre</div>
<input type="file" id="arch" accept=".csv,.txt" onchange="importar(this)">
</div>
<input id="fcat" placeholder="Buscar en catálogo" oninput="verCat()">
<div id="cat"></div>
</section>

<div id="dlg"></div>
<section id="s4"><div id="pv"></div></section>
<div id="msg"></div>

  var q=document.getElementById('bv').value.toLowerCase().trim(),h='',n=0;

        h+='<div class="card" onclick="vincular(\''+s+'\')"><b>'+esc(cat[s])+'</b><div class="small">SKU '+s+'</div></div>';

function importar(inp){
  var f=inp.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    var n=0;
    r.result.split(/\r?\n/).forEach(function(line){
      var i=line.indexOf(',');if(i<1)return;
      var s=line.slice(0,i).trim(),nom=line.slice(i+1).trim().replace(/^"|"$/g,'');
      if(/^\d+$/.test(s)&&nom){cat[s]=nom;n++}
    });
    sv(K.cat,cat);msg(n+' productos importados');verCat();
  };
  r.readAsText(f);
}

function buscarCodigo(){
  var q=document.getElementById('code').value.trim();actual=null;
  if(!q){msg('Escribe o pega un código, SKU o nombre');return}
  if(map[q]&&cat[map[q]]){mostrar(q,map[q]);return}
  if(cat[q]){mostrar('',q);return}
  if(/^\d{8,}$/.test(q)){pedirVinculo(q);return}
  listar(q);
}

function listar(q){
  var tk=q.toLowerCase().split(/\s+/),h='',n=0;

    var x=(cat[s]+' '+s).toLowerCase();

    }
  }
  document.getElementById('res').innerHTML=h||'<div class="small">No hay resultados. Agrégalo en la pestaña Catálogo.</div>';
}

  var d=v.replace(/\D/g,''),dd,mm,yy;
  if(d.length===8){dd=+d.slice(0,2);mm=+d.slice(2,4);yy=+d.slice(4)}
  else if(d.length===6){dd=+d.slice(0,2);mm=+d.slice(2,4);yy=2000+(+d.slice(4))}
  else return null;
  var t=new Date(yy,mm-1,dd);
  if(yy<2000||yy>2100||t.getFullYear()!==yy||t.getMonth()!==mm-1||t.getDate()!==dd)return null;
  return yy+'-'+('0'+mm).slice(-2)+'-'+('0'+dd).slice(-2);
}
function dias(iso){var a=new Date();a.setHours(0,0,0,0);var b=new Date(iso+'T00:00:00');return Math.round((b-a)/86400000)}
var fv='5';
function setFv(x){fv=x;verVenc()}
function verVenc(){
  var ops=[['v','Vencidos'],['1','1 día'],['5','5 días'],['10','10 días'],['15','15 días'],['20','20 días']],h='',items=[];
  var c='<div class="chips">'+ops.map(function(o){return '<button class="chip'+(fv===o[0]?' on':'')+'" onclick="setFv(\''+o[0]+'\')">'+o[1]+'</button>'}).join('')+'</div>';
  Object.keys(inv).forEach(function(s){inv[s].lotes.forEach(function(l){
    if(!l.venc||l.cant<=0)return;
    var d=dias(l.venc);
    if(fv==='v'?d<0:(d>=0&&d<=parseInt(fv)))items.push({s:s,l:l,d:d});
  })});
  items.sort(function(a,b){return a.d-b.d});
  items.forEach(function(x){
    var txt=x.d<0?'Venció hace '+(-x.d)+(x.d===-1?' día':' días'):(x.d===0?'Vence hoy':'Vence en '+x.d+(x.d===1?' día':' días'));
    h+='<div class="card" onclick="tab(1);mostrar(\'\',\''+x.s+'\')"><div class="row"><div style="flex:3"><b>'+esc(cat[x.s]||'(sin nombre)')+'</b><div class="small">SKU '+x.s+' · '+fmtF(x.l.venc)+'</div><span class="pill warn">'+txt+'</span></div><div class="qty">'+x.l.cant+'</div></div></div>';
  });
  document.getElementById('pv').innerHTML=c+(h||'<div class="small">No hay productos en este rango.</div>')+'<div class="small" style="margin-top:8px">Más próximo primero · '+items.length+' lotes</div>';
}
function guardarArchivo(nombre,datos){
  try{
    var b=(datos instanceof Blob)?datos:new Blob([datos],{type:'application/json'});
    var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=nombre;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(a.href)},3000);msg('Archivo listo. Búscalo en Descargas.');
  }catch(e){msg('No se pudo guardar el archivo')}
}
function respaldar(){
  var extra={};for(var s in cat){if(BASE[s]!==cat[s])extra[s]=cat[s]}
  guardarArchivo('respaldo-inventario-'+fechaHoy()+'.json',JSON.stringify({v:1,fecha:fechaHoy(),inv:inv,map:map,extra:extra}));
}
function restaurar(el){
  var f=el.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!d||d.v!==1||typeof d.inv!=='object')throw 0;
      var nuevo=norm(d.inv);
      confirmar('Esto reemplaza el conteo actual por el del respaldo ('+Object.keys(nuevo).length+' productos). ¿Continuar?',function(){
      hist.push(last);inv=nuevo;last=JSON.stringify(inv);
      Object.keys(d.map||{}).forEach(function(c){map[c]=d.map[c]});
      Object.keys(d.extra||{}).forEach(function(s){cat[s]=d.extra[s]});
      sv(K.inv,inv);sv(K.map,map);sv(K.cat,cat);
      verInv();msg('Respaldo restaurado. Puedes deshacerlo.')});el.value='';
    }catch(e){el.value='';msg('Ese archivo no es un respaldo válido')}
  };
  r.readAsText(f);
}
function mv(s,i,d){var l=lotes(s)[i];l.cant=Math.max(0,l.cant+d);sav()}
function setCant(s,i,v){v=parseInt(v);lotes(s)[i].cant=(isNaN(v)||v<0)?0:v;sav()}
function setVenc(s,i,v){
  var L=lotes(s);if(v.trim()===''){v=''}else{var p=parseF(v);if(!p){msg('Fecha no válida. Escribe día, mes y año, por ejemplo 15/03/2027');mostrar(cur.c,cur.sku);return}v=p}L[i].venc=v;
  L.sort(function(a,b){var x=a.venc||'9999',y=b.venc||'9999';return x<y?-1:(x>y?1:0)});
  sav();msg('Vencimiento guardado');
}
function addLote(s){lotes(s).push({cant:0,venc:''});sav()}
function delLote(s,i){
  var L=lotes(s);
  if(L[i].cant>0){confirmar('Esta fecha tiene '+L[i].cant+' unidades. ¿Borrarla?',function(){L.splice(i,1);if(!L.length)L.push({cant:0,venc:''});sav()});return}
  L.splice(i,1);if(!L.length)L.push({cant:0,venc:''});sav();
}

function verInv(){
  var f=(document.getElementById('filtro').value||'').toLowerCase(),h='',total=0,hoy=new Date(),lim=new Date(hoy.getTime()+90*86400000);
  Object.keys(inv).forEach(function(s){
    var L=inv[s].lotes.filter(function(l){return l.cant>0||l.venc});
    if(!L.length)return;
    var nom=cat[s]||'(sin nombre)',cods=Object.keys(map).filter(function(c){return map[c]===s}).join(' ');
    if(f&&nom.toLowerCase().indexOf(f)<0&&s.indexOf(f)<0&&cods.indexOf(f)<0)return;
    var t=0,rows='';
    L.forEach(function(l){
      t+=l.cant;
      var tag='<span class="pill">Sin fecha</span>';
      if(l.venc){var dd=dias(l.venc);tag=dd<0?'<span class="pill warn">VENCIDO '+fmtF(l.venc)+'</span>':(dd<=20?'<span class="pill warn">Vence pronto '+fmtF(l.venc)+'</span>':'<span class="pill">Vence '+fmtF(l.venc)+'</span>')}
      rows+='<div class="row" style="margin-top:4px"><div style="flex:3">'+tag+'</div><div style="text-align:right"><b>'+l.cant+'</b></div></div>';
    });
    total+=t;
    h+='<div class="card" onclick="tab(1);mostrar(\'\',\''+s+'\')"><div class="row"><div style="flex:3"><b>'+esc(nom)+'</b><div class="small">SKU '+s+'</div></div><div class="qty">'+t+'</div></div>'+rows+'</div>';
  });
  document.getElementById('inv').innerHTML=(h||'<div class="small">Aún no hay productos contados.</div>')+'<div class="small">Unidades totales: '+total+'</div>';
}

function exportar(){
  var l=['Codigo,Descripcion,Cantidad,Fecha de Vencimiento,Codigos de barras'];
  Object.keys(inv).forEach(function(s){
    var cods=Object.keys(map).filter(function(c){return map[c]===s}).join(' ');
    inv[s].lotes.forEach(function(x){
      if(x.cant>0||x.venc)l.push([s,'"'+(cat[s]||'').replace(/"/g,'""')+'"',x.cant,fmtF(x.venc),cods].join(','));
    });
  });
  var b=new Blob(['\ufeff'+l.join('\n')],{type:'text/csv'});
  guardarArchivo('inventario-'+fechaHoy()+'.csv',b);
}

</script>
